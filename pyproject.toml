[project]
name = "vamos"
version = "0.1.0"
description = "Real-time poker assistant for PokerNow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eval7>=0.1.11",
    "pyyaml>=6.0.3",
]

[project.scripts]
vamos = "vamos.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vamos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not integration'"
markers = [
    "slow: long-running reference checks (run with -m slow)",
    "integration: hits a live external service",
]
