[project]
name = "vamos"
version = "0.1.0"
description = "Real-time poker assistant for PokerNow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "eval7>=0.1.11",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
vamos = "vamos.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vamos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests quote real PokerNow log lines verbatim, and those are long.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not corpus'"
filterwarnings = [
    # eval7 parses range strings with a pyparsing call that pyparsing has deprecated; it is
    # third-party code, emitted once at import.
    "ignore::DeprecationWarning:eval7.rangestring",
]
markers = [
    "corpus: checks against third-party data in tests/corpus (fetched by scripts/fetch_*.py)",
]
